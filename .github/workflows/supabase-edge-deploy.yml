name: Supabase Edge Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
  push:
    branches:
      - main
      - release/**
    tags:
      - "v*"

jobs:
  deploy-edge-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'dev' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      API_JWT_SECRET: ${{ secrets.DEV_API_JWT_SECRET }}
      SUPABASE_PROD_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_URL API_JWT_SECRET SUPABASE_PROD_PROJECT_REF; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required secret/env: $key"
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Edge secrets (dev)
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            APP_ENV=development \
            API_HOST=0.0.0.0 \
            API_PORT=8787 \
            ACCESS_TOKEN_TTL_SECONDS=900 \
            REFRESH_TOKEN_TTL_SECONDS=2592000 \
            CORS_ORIGIN=* \
            ALLOW_DEV_PROD_DB=NO \
            API_JWT_SECRET="$API_JWT_SECRET" \
            GMD_SUPABASE_DB_URL="$SUPABASE_DB_URL" \
            GMD_SUPABASE_PROJECT_REF_EXPECTED="$PROJECT_REF" \
            GMD_SUPABASE_PROD_PROJECT_REF="$SUPABASE_PROD_PROJECT_REF" \
            --project-ref "$PROJECT_REF"

      - name: Deploy gmd-api (dev)
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy gmd-api --project-ref "$PROJECT_REF" --no-verify-jwt

  deploy-edge-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'prod' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      API_JWT_SECRET: ${{ secrets.PROD_API_JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_URL API_JWT_SECRET; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "Missing required secret/env: $key"
              exit 1
            fi
          done

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Edge secrets (prod)
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            APP_ENV=production \
            API_HOST=0.0.0.0 \
            API_PORT=8787 \
            ACCESS_TOKEN_TTL_SECONDS=900 \
            REFRESH_TOKEN_TTL_SECONDS=2592000 \
            CORS_ORIGIN=* \
            ALLOW_DEV_PROD_DB=NO \
            API_JWT_SECRET="$API_JWT_SECRET" \
            GMD_SUPABASE_DB_URL="$SUPABASE_DB_URL" \
            GMD_SUPABASE_PROJECT_REF_EXPECTED="$PROJECT_REF" \
            GMD_SUPABASE_PROD_PROJECT_REF="$PROJECT_REF" \
            --project-ref "$PROJECT_REF"

      - name: Deploy gmd-api (prod)
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy gmd-api --project-ref "$PROJECT_REF" --no-verify-jwt
