<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMD Medical Platform</title>
    <style>
      #gmd-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 20%, #1d4ed8 0%, #0f172a 55%, #020617 100%);
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #gmd-boot-splash[data-hidden='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .gmd-boot-card {
        width: min(460px, 92vw);
        background: rgba(255, 255, 255, 0.98);
        border-radius: 24px;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        padding: 40px 32px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #0f172a;
      }

      .gmd-boot-logo {
        width: auto;
        height: 72px;
      }

      .gmd-boot-title {
        margin: 12px 0 14px;
        font-size: 1.875rem;
        line-height: 1.2;
      }

      .gmd-boot-spinner {
        width: 54px;
        height: 54px;
        margin: 0 auto 14px;
        border-radius: 999px;
        border: 4px solid rgba(3, 161, 158, 0.25);
        border-top-color: #1e3a8a;
        animation: gmd-boot-spin 0.9s linear infinite;
      }

      .gmd-boot-message {
        margin: 0;
        font-size: 1rem;
        color: #475569;
      }

      @keyframes gmd-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="gmd-boot-splash" role="status" aria-live="polite">
      <div class="gmd-boot-card">
        <img src="/logo_aziendale.png" alt="GMD Medical" class="gmd-boot-logo" />
        <h1 class="gmd-boot-title">GMD Medical Platform</h1>
        <div class="gmd-boot-spinner" aria-hidden="true"></div>
        <p class="gmd-boot-message">Avvio in corso...</p>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (() => {
        const splash = document.getElementById('gmd-boot-splash');
        if (!splash) return;

        let hidden = false;
        let fallbackTimerId = 0;

        const hide = () => {
          if (hidden) return;
          hidden = true;
          if (fallbackTimerId) {
            clearTimeout(fallbackTimerId);
          }
          splash.setAttribute('data-hidden', 'true');
          setTimeout(() => splash.remove(), 260);
        };

        window.addEventListener(
          'gmd:app-ready',
          () => hide(),
          { once: true }
        );

        if (window.__gmdAppReady === true) {
          hide();
        }

        // Fallback: evita splash bloccata se bootstrap non emette l'evento.
        fallbackTimerId = setTimeout(() => {
          hide();
        }, 12000);
      })();
    </script>
  </body>
</html>
