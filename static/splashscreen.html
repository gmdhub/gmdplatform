<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMD Medical Platform</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      body {
        background: radial-gradient(circle at 20% 20%, #1d4ed8 0%, #0f172a 55%, #020617 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

      .card {
        width: min(460px, 90vw);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.98);
        padding: 38px 32px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.12), 0 10px 12px -6px rgb(0 0 0 / 0.12);
        color: #0f172a;
      }

      .logo {
        height: 72px;
        width: auto;
      }

      h1 {
        margin: 14px 0 14px;
        font-size: 1.9rem;
        line-height: 1.2;
      }

      .spinner {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        margin: 0 auto 14px;
        border: 4px solid rgba(3, 161, 158, 0.24);
        border-top-color: #1e3a8a;
        animation: spin 900ms linear infinite;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <section class="card" role="status" aria-live="polite">
      <img src="/logo_aziendale.png" alt="GMD Medical" class="logo" />
      <h1>GMD Medical Platform</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p>Avvio in corso...</p>
    </section>
  </body>
</html>
